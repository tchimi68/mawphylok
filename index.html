  <title>Calcul Tenue de Pression — Hy-Lok</title>

// Libellés taille tube
const TUBE_LABELS = {
  '1':'1/16"','2':'1/8"','4':'1/4"','6':'3/8"','8':'1/2"',
  '12':'3/4"','16':'1"','20':'1¼"','24':'1½"','32':'2"',
  '4M':'4 mm','6M':'6 mm','8M':'8 mm','10M':'10 mm',

// Filetage mâle (M) — NPT, BSPT, BSPP CMC
// Note : 8N et 8R corrigés à 530 bar (770 PSI était une erreur ×10 dans le fichier source)

  '1N':759, '2N':690, '4N':552, '6N':538, '8N':531, '12N':504, '16N':366, '20N':414, '24N':345, '32N':269,
  '1R':759, '2R':690, '4R':552, '6R':538, '8R':531, '12R':504, '16R':366, '20R':414, '24R':345, '32R':269,
  '2G':400, '4G':400, '6G':400, '8G':324, '12G':250, '16G':250, '20G':160, '24G':160, '32G':160,
};

// Taraudage femelle (F) — NPT, BSPT
// BSPP G femelle : données manquantes
const FEMALE_DATA = {
  '1N':462, '2N':448, '4N':455, '6N':366, '8N':338, '12N':317, '16N':303, '20N':345, '24N':317, '32N':269,
  '1R':462, '2R':448, '4R':455, '6R':366, '8R':338, '12R':317, '16R':303, '20R':345, '24R':317, '32R':269,

// Facteurs température 316SS
const TEMP_FACTORS = [
  { label:'≤ 100 °F  (≤ 38 °C)',   factor:1.00 },

const RACCORD_LIST = [
  "CLMA8M2N","CLA18M","CBU16M","CMC18M8R","CMC16M8G","CR8M12M","CTA18M","CUA6M",
  "CMC16M8N","CMC12M8N","CAM8M4R","CMC12M4N","CUA12M","CBU12M","CMC8M4G","CTA8",

  "CBFC12M8N","CLMA6M2R","CBTF12M4N","CR12M10M","CLMA12M6R","CAM86R",
  "CAM12M4N","CUR12M8","CMC6M6R","CAM88R","CMC16M12R","CMC10M4R","CAF8M4N",
  "CPC10M","CMC66R","CTR664","CMC88R","CUR16M10","CR48","CR8M6M","CAF12M4N",
  "CR20M12M","CMC44N","CR12M18M","CLMA8M8N","CMC20M8N","CUA8","CR12M16M","CR64",
  "CAFG10M4G","CFC8M4N","CMCT68N","CMC46R","CMC10M6N","CXA10M","CR12M8M","CPA20M",
  "CLMA12M8N","CPA8","CMC64N","CUA8M","CUA-8M-OP1 S316","CR18M12","CBU3M",
  "CMC8M4G","CMC8M8R","CR86","CBU20M","CTR16M16M6M","CMC44R","CLMA12M4N",
  "CUR16M12M","CAF6M4N","CPC16M","CR16M12M","CBTF12M4N","CMC8M6R","CRTF10M4N",
  "CAF12M4N","CTRM10M10M6M","CFC16M8N","CAFG8M4G","CMC12M8G","CTA12M","CMC12M6R",
  "CTA16M","CAM8M4N","CMC12M4G","CMC6M2R","CTA6M","CBU16M","CMC10M8R","CR6M12M",
  "CBU8","CUR12M8M","CUA16M","CUA8M","CAM12M8N","CAM16M8R",
  "CFC8M8R","CAM16M8R","CMC12M12G","CMC8M8N","CFC6M4N",
  "CBU6M","CAF12M8N","CMC8M2R","CMC12M4R","CFC12M8N","CTA12M","CXA12M","CAM12M6R",
  "CBU4M","CMC6M6R","CPA12M","CLA12M","CR4M6M","CR12M16M","CTA16M","CMC12M8R",
  "CUR8M6M","CAM64R","CAM6M2R","CPR12M8M","CGC6M6G","CAM12M4R","CXA6M","CAM44R",
  "CPA8M","CMC8M8G","CBU8M","CMC8M4N","CAF88N","CMC88N","CMC6M2N","CAF84N",

];

// =============================================================================
// PARSING
// =============================================================================

function parseRef(fullRef) {
  let s = fullRef.trim();

  // Supprimer suffixe matériau (.SS316, .BRASS, .SS31, etc.)
  const dotIdx = s.indexOf('.');
  if (dotIdx > 0) s = s.substring(0, dotIdx);

  // Supprimer ce qui suit un espace ou + (ex: +G37)
  s = s.replace(/[\s+].*$/, '');

  // Supprimer options -OPxx
  s = s.replace(/-OP\d+.*$/i, '');

  // Extraire le préfixe type (lettres majuscules initiales)
  const typeMatch = s.match(/^([A-Z]+)/);
  if (!typeMatch) return { error: 'Format non reconnu' };

  const typePrefix = typeMatch[1];
  let remainder = s.slice(typePrefix.length);

  // Gérer tiret séparateur (CUA-8M)
  if (remainder.startsWith('-')) remainder = remainder.slice(1);
  remainder = remainder.replace(/-/g, '');

  // Vérifier le type
  if (!(typePrefix in TYPE_TABLE)) {
    return { error: `Type "${typePrefix}" non répertorié`, typePrefix };
  }
  const typeInfo = TYPE_TABLE[typePrefix];
  if (typeInfo === null) {
    return { skip: true, typePrefix };
  }

  // Parser les segments bruts, puis assigner les types par position
  // Dénominations valides (du plus long au plus court pour éviter la gloutonnie) :
  // - tube métrique : n'importe quel nombre + M (priorité 1, sans ambiguïté)
  // - filetage / tube fractional : 32,24,20,16,12,8,6,4,2,1
  const DENOM = '(?:32|24|20|16|12|8|6|4|2|1)';

  const rawSegs = [];
  let r = remainder;

  while (r.length > 0) {
    // 1. Tube métrique : \d+M (unambiguë — M ne peut pas être un suffixe de filetage)
    let m = r.match(/^(\d+M)/i);
    if (m) {
      rawSegs.push({ code: m[1].toUpperCase(), rawType: 'tube' });
      r = r.slice(m[1].length);
      continue;
    }
    // 2. Filetage : dénomination connue + [NRG]
    m = r.match(new RegExp('^(' + DENOM + ')([NRG])', 'i'));
    if (m) {
      rawSegs.push({ code: m[1] + m[2].toUpperCase(), rawType: 'thread' });
      r = r.slice(m[1].length + 1);
      continue;
    }
    // 3. Tube fractional : dénomination connue NON suivie de [NRG]
    m = r.match(new RegExp('^(' + DENOM + ')(?![NRG]|$(?!$))', 'i'));
    if (m) {
      rawSegs.push({ code: m[1], rawType: 'tube' });
      r = r.slice(m[1].length);
      continue;
    }
    // 3b. Tube fractional en fin de chaîne (lookahead ne matche pas $ seul)
    m = r.match(new RegExp('^(' + DENOM + ')$', 'i'));
    if (m) {
      rawSegs.push({ code: m[1], rawType: 'tube' });
      r = r.slice(m[1].length);
      continue;
    }
    // Caractère inconnu → arrêt
    break;
  }

  // Assigner les types par position :
  // - segments tube : 1er → conn1 (toujours T), suivants → conn2
  // - segments filetage → conn2
  let tubeIdx = 0;
  const segments = rawSegs.map(seg => {
    if (seg.rawType === 'tube') {
      const connType = tubeIdx === 0 ? 'T' : typeInfo.conn2;
      tubeIdx++;
      const lbl = connType === 'T'
        ? 'Tube ' + (TUBE_LABELS[seg.code] || seg.code)
        : connTypeLabel(connType, seg.code);
      return { code: seg.code, connType, label: lbl };
    } else {
      const connType = typeInfo.conn2;
      return { code: seg.code, connType, label: connTypeLabel(connType, seg.code) };
    }
  });

  if (segments.length === 0) {
    return { error: 'Aucun embout identifié dans la référence' };
  }

  return { typePrefix, typeInfo, segments };
}

function connTypeLabel(ct, code) {
  if (ct === 'M')  return `Filetage mâle ${code}`;
  if (ct === 'F')  return `Taraudage femelle ${code}`;
  if (ct === 'MO') return `Filetage mâle O (COM) ${code}`;
  if (ct === 'A')  return `Adapteur ${code}`;
  return code;
}

// =============================================================================
// ÉTAT UI
// =============================================================================

let currentParsed = null;

// =============================================================================
// INIT
// =============================================================================

function init() {
  // Liste de raccords : dédupliquée, triée, types "Ne pas prendre en compte" exclus
  const sel = document.getElementById('refSelect');
  const uniq = [...new Set(RACCORD_LIST)].sort();
  uniq.forEach(ref => {
    const parsed = parseRef(ref);
    if (parsed.skip) return; // exclure CAF, CAM, CAL, CRTA, CBTA
    const opt = document.createElement('option');
    opt.value = ref;
    opt.textContent = ref;
    sel.appendChild(opt);
  });

  // Températures
  const tempSel = document.getElementById('tempSelect');
  TEMP_FACTORS.forEach((t, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${t.label}   (× ${t.factor})`;
    tempSel.appendChild(opt);
  });
  // Sélectionner la première option par défaut
  tempSel.value = '0';
}

// =============================================================================
// ÉVÉNEMENTS
// =============================================================================

function onRefChange() {
  const ref = document.getElementById('refSelect').value;
  const dynamicZone = document.getElementById('dynamicZone');
  document.getElementById('resultContainer').innerHTML = '';

  if (!ref) {
    dynamicZone.style.display = 'none';
    return;
  }

  dynamicZone.style.display = 'block';
  const parsed = parseRef(ref);
  currentParsed = parsed;

  const infoMsg    = document.getElementById('infoMsg');
  const connBlock  = document.getElementById('connBlock');
  const connRows   = document.getElementById('connRows');
  const tempBlock  = document.getElementById('tempBlock');
  const btnCalc    = document.getElementById('btnCalc');

  // Reset
  infoMsg.style.display = 'none';
  connBlock.style.display = 'none';
  tempBlock.style.display = 'none';
  btnCalc.disabled = true;
  connRows.innerHTML = '';

  if (parsed.error) {
    infoMsg.className = 'info-box red';
    infoMsg.textContent = parsed.error;
    infoMsg.style.display = 'block';
    return;
  }

  if (parsed.skip) {
    infoMsg.className = 'info-box orange';
    infoMsg.textContent = `Ce type de raccord (${parsed.typePrefix}) n'est pas pris en charge dans le calcul.`;
    infoMsg.style.display = 'block';
    return;
  }

  // Construire les lignes de connexion
  connBlock.style.display = 'block';
  const seenTubes = new Set();

  parsed.segments.forEach(seg => {
    const row = document.createElement('div');
    row.className = 'conn-row';

    const tag = document.createElement('span');
    tag.className = `conn-tag tag-${seg.connType}`;
    tag.textContent = seg.connType;

    const lbl = document.createElement('span');
    lbl.className = 'conn-label';
    lbl.textContent = seg.label;

    row.appendChild(tag);
    row.appendChild(lbl);

    if (seg.connType === 'T') {
      if (!seenTubes.has(seg.code)) {
        seenTubes.add(seg.code);
        const tubeOptions = TUBE_DATA[seg.code];

        if (!tubeOptions) {
          const span = document.createElement('span');
          span.style.cssText = 'font-size:0.82rem; color:#c62828; font-style:italic;';
          span.textContent = 'Taille non reconnue';
          row.appendChild(span);
        } else {
          const sel = document.createElement('select');
          sel.id = `tube_${seg.code}`;
          sel.onchange = checkCalcReady;
          const defOpt = document.createElement('option');
          defOpt.value = '';
          defOpt.textContent = '— Épaisseur —';
          sel.appendChild(defOpt);
          tubeOptions.forEach(o => {
            const opt = document.createElement('option');
            opt.value = o.bar;
            opt.textContent = `${o.ep} mm  →  ${o.bar} bar`;
            sel.appendChild(opt);
          });
          row.appendChild(sel);
        }
      } else {
        // Même tube déjà affiché (ex: union même taille)
        const span = document.createElement('span');
        span.style.cssText = 'font-size:0.82rem; color:#888; font-style:italic;';
        span.textContent = 'même taille — voir ci-dessus';
        row.appendChild(span);
      }
    } else {
      // Connexion non-tube : afficher la pression de référence si disponible
      const p = getConnPressure(seg);
      const span = document.createElement('span');
      if (p === null) {
        span.style.cssText = 'font-size:0.82rem; color:#a05000; font-style:italic;';
        span.textContent = 'Données manquantes';
      } else if (p === undefined) {
        span.style.cssText = 'font-size:0.82rem; color:#888; font-style:italic;';
        span.textContent = 'Ignoré (adapteur)';
      } else {
        span.style.cssText = 'font-size:0.88rem; color:#2e7d32; font-weight:600;';
        span.textContent = `${p} bar`;
      }
      row.appendChild(span);
    }

    connRows.appendChild(row);
  });

  tempBlock.style.display = 'block';
  checkCalcReady();
}

function getConnPressure(seg) {
  if (seg.connType === 'T') return null; // handled separately
  if (seg.connType === 'A') return undefined;
  if (seg.connType === 'M')  return MALE_DATA[seg.code] !== undefined ? MALE_DATA[seg.code] : null;
  if (seg.connType === 'F')  return FEMALE_DATA[seg.code] !== undefined ? FEMALE_DATA[seg.code] : null;
  if (seg.connType === 'MO') return MO_DATA[seg.code] !== undefined ? MO_DATA[seg.code] : null;
  return null;
}

function checkCalcReady() {
  if (!currentParsed || currentParsed.error || currentParsed.skip) {
    document.getElementById('btnCalc').disabled = true;
    return;
  }

  const seenTubes = new Set();
  let allSelected = true;

  currentParsed.segments.forEach(seg => {
    if (seg.connType !== 'T') return;
    if (seenTubes.has(seg.code)) return;
    seenTubes.add(seg.code);

    if (!TUBE_DATA[seg.code]) return; // taille inconnue, on ignore

    const val = document.getElementById(`tube_${seg.code}`)?.value;
    if (!val) allSelected = false;
  });

  const hasTempSelected = document.getElementById('tempSelect').value !== '';
  document.getElementById('btnCalc').disabled = !(allSelected && hasTempSelected);
}

// =============================================================================
// CALCUL
// =============================================================================

function calculate() {
  const parsed = currentParsed;
  if (!parsed || parsed.error || parsed.skip) return;

  const tempIdx = parseInt(document.getElementById('tempSelect').value);
  const tempInfo = TEMP_FACTORS[tempIdx];

  const details = [];    // lignes du détail
  const warnings = [];   // avertissements
  const tubePressures  = [];
  const otherPressures = [];

  const seenTubes = new Set();

  parsed.segments.forEach(seg => {
    if (seg.connType === 'T') {
      if (seenTubes.has(seg.code)) {
        details.push({ label: seg.label, bar: null, note: 'même tube (même épaisseur)' });
        return;
      }
      seenTubes.add(seg.code);

      if (!TUBE_DATA[seg.code]) {
        warnings.push(`Taille tube "${seg.code}" non reconnue — connexion ignorée`);
        details.push({ label: seg.label, bar: null, note: 'taille inconnue' });
        return;
      }

      const val = document.getElementById(`tube_${seg.code}`)?.value;
      if (!val) return;
      const bar = parseFloat(val);
      tubePressures.push({ label: seg.label, bar });
      details.push({ label: seg.label, bar });

    } else if (seg.connType === 'A') {
      details.push({ label: seg.label, bar: null, note: 'adapteur — ignoré' });

    } else {
      const bar = getConnPressure(seg);
      if (bar === null) {
        const isG = seg.code.endsWith('G');
        const msg = isG && seg.connType === 'F'
          ? `BSPP femelle ${seg.code} : données manquantes (à compléter)`
          : `${seg.label} : données manquantes`;
        warnings.push(msg);
        details.push({ label: seg.label, bar: null, note: 'données manquantes' });
      } else {
        otherPressures.push({ label: seg.label, bar });
        details.push({ label: seg.label, bar });
      }
    }
  });

  // Règle : si connexion(s) tube → on utilise uniquement la pression tube
  // Sinon : minimum de toutes les connexions
  let basePressure = null;
  let limitingLabel = '';

  if (tubePressures.length > 0) {
    const min = tubePressures.reduce((a, b) => a.bar < b.bar ? a : b);
    basePressure = min.bar;
    limitingLabel = min.label;
  } else if (otherPressures.length > 0) {
    const min = otherPressures.reduce((a, b) => a.bar < b.bar ? a : b);
    basePressure = min.bar;
    limitingLabel = min.label;
  }

  renderResult({ basePressure, limitingLabel, tempInfo, details, warnings });
}

// =============================================================================
// RENDU RÉSULTAT
// =============================================================================

function renderResult({ basePressure, limitingLabel, tempInfo, details, warnings }) {
  const container = document.getElementById('resultContainer');

  if (basePressure === null) {
    container.innerHTML = `
      <div class="result-card">
        <div class="result-header red">
          <div style="font-size:1rem; color:#b71c1c; font-weight:600;">
            Impossible de calculer — données insuffisantes
          </div>
        </div>
        <div class="result-body">
          ${warnings.map(w => `<div class="warn-item">${w}</div>`).join('')}
        </div>
      </div>`;
    return;
  }

  const finalPressure = Math.round(basePressure * tempInfo.factor * 10) / 10;
  const headerClass = warnings.length > 0 ? 'orange' : 'green';

  // Lignes de détail
  let detailHTML = details.map(d => {
    if (d.bar === null) {
      return `<div class="detail-row">
        <span class="detail-key">${d.label}</span>
        <span class="detail-val muted">${d.note || '—'}</span>
      </div>`;
    }
    const isLimiting = d.label === limitingLabel;
    return `<div class="detail-row">
      <span class="detail-key">${d.label}</span>
      <span class="detail-val ${isLimiting ? 'limiting' : ''}">${d.bar} bar${isLimiting ? '&nbsp; ← limitant' : ''}</span>
    </div>`;
  }).join('');

  detailHTML += `<div class="separator"></div>`;
  detailHTML += `<div class="detail-row">
    <span class="detail-key">Température (${tempInfo.label})</span>
    <span class="detail-val">× ${tempInfo.factor}</span>
  </div>`;
  detailHTML += `<div class="detail-row" style="margin-top:4px;">
    <span class="detail-key" style="font-weight:700; color:#1a1a2e;">Pression admissible</span>
    <span class="detail-val" style="font-size:1.05rem; color:#1b3a5c;">${finalPressure} bar</span>
  </div>`;

  const warnsHTML = warnings.map(w => `<div class="warn-item">${w}</div>`).join('');

  container.innerHTML = `
    <div class="result-card">
      <div class="result-header ${headerClass}">
        <div class="pressure-val">${finalPressure}<span class="pressure-unit">bar</span></div>
        <div class="pressure-label">Pression maximale admissible</div>
      </div>
      <div class="result-body">
        ${detailHTML}
        ${warnsHTML}
      </div>
    </div>`;
}

// =============================================================================
init();
</script>
</body>
</html>
